name: Build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (zip reader + unpacker)
        run: swift test --package-path Core

  ipa:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Unpacker.xcodeproj -scheme Unpacker \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Unpacker.app Payload/
          zip -qry Unpacker-unsigned.ipa Payload
          ls -la Unpacker-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Unpacker-unsigned-ipa
          path: Unpacker-unsigned.ipa
          retention-days: 30
