name: Build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (zip reader + unpacker)
        run: swift test --package-path Core --skip SpeedTests
      - name: Speed (optimised build, like the app)
        run: swift test --package-path Core -c release -Xswiftc -enable-testing --filter SpeedTests 2>&1 | grep -E "SPEED|Executed|error" || true

  ipa:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Unpacker.xcodeproj -scheme Unpacker \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Unpacker.app Payload/
          zip -qry Unpacker-unsigned.ipa Payload
          ls -la Unpacker-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Unpacker-unsigned-ipa
          path: Unpacker-unsigned.ipa
          retention-days: 30
      - name: Publish as the "latest" release (fixed download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/Unpacker.app/Info.plist)
          NOTES="Unpacker $VERSION (build ${{ github.run_number }}), commit ${GITHUB_SHA::7}. Unsigned: install with Sideloadly."
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --target "$GITHUB_SHA" --title "Latest build" --notes "$NOTES"
          gh release upload latest Unpacker-unsigned.ipa --clobber
          gh release edit latest --notes "$NOTES"

  screenshots:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick and boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          phones = [d for d in devs if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] \
                   or [d for d in devs if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: Build for the simulator
        run: |
          xcodebuild -project Unpacker.xcodeproj -scheme Unpacker -configuration Debug \
            -destination "id=$SIM" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0
      - name: Take a screenshot of each screen
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Unpacker.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$SIM" "$APP"
          mkdir -p screenshots
          for screen in inbox select sheet progress results batch player settings; do
            xcrun simctl terminate "$SIM" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$SIM" "$BUNDLE" -UnpackerDemo YES -UnpackerScreen "$screen"
            sleep 7
            xcrun simctl io "$SIM" screenshot "screenshots/$screen.png"
          done
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png
          retention-days: 30
